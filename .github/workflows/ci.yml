name: Qualidade

on:
  push:
    branches: [main, "release/**", "recurso/**", "correcao/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Instalar bibliotecas Qt no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libpulse0
      - run: uv python install 3.11.16
      - run: uv venv --python 3.11.16
      - run: uv pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -r requirements/cpu.txt
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python -m pytest
      - run: uv run --no-sync python build.py --prepare-ffmpeg
      - run: uv run --no-sync python main.py --self-check
