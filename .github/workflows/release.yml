name: Publicar executáveis

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: WhisperTranscriber-Windows-x64
            executable: dist/WhisperTranscriber.exe
          - os: ubuntu-latest
            artifact: WhisperTranscriber-Linux-x64
            executable: dist/WhisperTranscriber
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.11
      - run: uv venv --python 3.11
      - run: uv pip install -r requirements/cpu.txt
      - run: uv run --no-sync python build.py
      - name: Autoverificar executável
        shell: bash
        run: ./${{ matrix.executable }} --self-check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error

  release:
    name: Criar GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artefatos/**/*
