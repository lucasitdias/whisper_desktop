name: Publicar downloads

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Instalar bibliotecas Qt no Linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - run: uv python install 3.11
      - run: uv venv --python 3.11
      - run: uv pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -r requirements/cpu.txt
      - run: uv run --no-sync python build.py
      - name: Nomear artefato e gerar checksum
        run: |
          mv dist/WhisperTranscriber dist/WhisperTranscriber-Linux-x64
          sha256sum dist/WhisperTranscriber-Linux-x64 > dist/SHA256SUMS.txt
      - name: Autoverificar executável
        run: ./dist/WhisperTranscriber-Linux-x64 --self-check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Downloads-WhisperTranscriber
          path: |
            dist/WhisperTranscriber-Linux-x64
            dist/SHA256SUMS.txt
            store/Instalar-WhisperTranscriber-Windows.url
          if-no-files-found: error

  release:
    name: Criar GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artefatos
      - uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: artefatos/**/*
          body: |
            ## Downloads

            - **Windows 10/11 x64:** [instalar pela Microsoft Store](https://apps.microsoft.com/detail/9PHWS6MM59BG), ou baixar `Instalar-WhisperTranscriber-Windows.url` para abrir a mesma página.
            - **Linux x86-64:** baixar `WhisperTranscriber-Linux-x64` e validar com `SHA256SUMS.txt`.
            - **Código-fonte:** usar os arquivos `.zip` ou `.tar.gz` gerados pelo GitHub abaixo.

            A versão Windows é distribuída pela Store para receber a assinatura
            confiável da Microsoft. O MSIX não assinado do Partner Center não é
            oferecido como instalador direto.
