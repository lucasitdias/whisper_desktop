name: Publicar executável Linux

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Instalar bibliotecas Qt no Linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - run: uv python install 3.11
      - run: uv venv --python 3.11
      - run: uv pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -r requirements/cpu.txt
      - run: uv run --no-sync python build.py
      - name: Autoverificar executável
        run: ./dist/WhisperTranscriber --self-check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: WhisperTranscriber-Linux-x64
          path: dist/WhisperTranscriber
          if-no-files-found: error

  release:
    name: Criar GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artefatos
      - uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: artefatos/**/*
          body: |
            A versão para Windows é distribuída com assinatura confiável pela
            Microsoft Store. O artefato desta release é a versão portátil para
            Linux x86-64.
