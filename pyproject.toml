[project]
name = "whisper-transcriber-desktop"
version = "0.1.0"
description = "Aplicativo desktop local para transcrição de MP3 e M4A em Markdown."
readme = "docs/README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai-whisper==20250625",
    "pyside6>=6.8,<7",
    "torch==2.12.1",
]

[dependency-groups]
dev = [
    "pillow>=11,<13",
    "pyinstaller>=6.16,<7",
    "pytest>=8.4,<10",
    "pytest-qt>=4.5,<5",
    "ruff>=0.12,<1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
addopts = "-ra"
qt_api = "pyside6"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".venv-cpu"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
